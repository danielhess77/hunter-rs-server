<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hunter Terminal</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="container">

        <h1>Hunter Terminal</h1>

        <div class="watchlistBar">

            <div class="watchlistControl">

                <label for="watchlistSelect">Watchlist:</label>

                <select id="watchlistSelect">
                    <option value="Growth" selected>Growth</option>
                    <option value="Semiconductors">Semiconductors</option>
                    <option value="Mag7">Mag 7</option>
                    <option value="AILeaders">AI Leaders</option>
                    <option value="CurrentWatch">Current Watch</option>
                </select>

            </div>

            <div class="timeframeControl">

                <label for="timeframeSelect">RS Timeframe:</label>

                <select id="timeframeSelect">
                    <option value="1Day">1 Day</option>
                    <option value="3Day" selected>3 Day</option>
                    <option value="5Day">5 Day</option>
                    <option value="10Day">10 Day</option>
                    <option value="Today">Today</option>
                </select>

            </div>

            <div class="managerControl">

                <button id="manageWatchlists">
                ⚙  ️ Manage Watchlists
                </button>

</div>

        </div>

        <table id="rsTable">

            <thead>

                <tr>

                    <th>Ticker</th>
                    <th>Market</th>
                    <th>QQQ</th>
                    <th>Sector RS</th>
                    <th>Sector</th>
                    <th>Momentum</th>

                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>

    <script type="module" src="app.js"></script>

</body>

</html>
