<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hunter Terminal</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="container">

        <h1>Hunter Terminal</h1>

        <div class="watchlistBar">

        <div>
            <span>Watchlist:</span>
            <strong>Growth</strong>
        </div>

        <div class="timeframeControl">
            <label for="timeframeSelect">RS Timeframe:</label>

            <select id="timeframeSelect">
                <option value="1Day">1 Day</option>
                <option value="3Day" selected>3 Day</option>
                <option value="5Day">5 Day</option>
                <option value="10Day">10 Day</option>
            </select>
        </div>

        </div>

        <table id="rsTable">

            <thead>

                <tr>

                    <th>Ticker</th>
                    <th>Market</th>
                    <th>QQQ</th>
                    <th>Sector</th>
                    <th>Leadership</th>
                    <th>Momentum</th>

                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>

    <script type="module" src="app.js"></script>

</body>

</html>
